services:
  - type: web
    name: barometr-app
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 server.app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barometr-accounts
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ADMIN1_USERNAME
        sync: false
      - key: ADMIN1_PASSWORD
        sync: false
      - key: ADMIN2_USERNAME
        sync: false
      - key: ADMIN2_PASSWORD
        sync: false
databases:
  - name: barometr-accounts
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'
    ipAllowList: []
